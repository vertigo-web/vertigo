version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  unit-tests:
    desc: Unit tests
    cmds:
      - cargo test --all-features

  reactive-compare:
    desc: Compare old vs new reactive graph performance
    cmds:
      - cargo test --release -p vertigo --lib reactive_old::compare -- --nocapture --test-threads=1

  bench:
    desc: "All four benchmark suites (NOTE: three of them need a WebDriver on localhost:9515)"
    cmds:
      - task: ssr-bench
      - task: hydration-bench
      - task: reactive-bench
      - task: dom-bench

  bench-compare:
    desc: "All four suites, each against its own target/bench/<suite>/latest.json"
    cmds:
      - task: ssr-bench-compare
      - task: hydration-bench-compare
      - task: reactive-bench-compare
      - task: dom-bench-compare

  reactive-bench:
    desc: "Reactive graph benchmark in a browser (NOTE: WebDriver on localhost:9515 needs to be running)"
    cmds:
      - cargo test --package fantoccini-tests --test reactive_bench -- --ignored --nocapture

  reactive-bench-compare:
    desc: "Reactive graph benchmark against an earlier run (BASELINE=path/to.json, defaults to the last)"
    env:
      VERTIGO_REACTIVE_BENCH_BASELINE: '{{.BASELINE | default "target/bench/reactive/latest.json"}}'
    cmds:
      - cargo test --package fantoccini-tests --test reactive_bench -- --ignored --nocapture

  dom-bench:
    desc: "Reactive framework end to end - graph, DOM commands, rendering (NOTE: WebDriver on localhost:9515 needs to be running)"
    cmds:
      - cargo test --package fantoccini-tests --test dom_bench -- --ignored --nocapture

  dom-bench-compare:
    desc: "End-to-end benchmark against an earlier run (BASELINE=path/to.json, defaults to the last)"
    env:
      VERTIGO_DOM_BENCH_BASELINE: '{{.BASELINE | default "target/bench/dom/latest.json"}}'
    cmds:
      - cargo test --package fantoccini-tests --test dom_bench -- --ignored --nocapture

  hydration-bench:
    desc: "Hydration benchmark in a browser (NOTE: WebDriver on localhost:9515 needs to be running)"
    cmds:
      - cargo test --release --package fantoccini-tests --test hydration_bench -- --ignored --nocapture

  hydration-bench-compare:
    desc: "Hydration benchmark against another implementation's run (BASELINE=path/to.json)"
    env:
      VERTIGO_HYDRATION_BENCH_BASELINE: '{{.BASELINE | default "target/bench/hydration/latest.json"}}'
    cmds:
      - cargo test --release --package fantoccini-tests --test hydration_bench -- --ignored --nocapture

  ssr-bench:
    desc: "Server-side rendering benchmark, per phase (native - no browser, no WebDriver)"
    env:
      # The host logs nothing above warn on a healthy run, so anything this surfaces is a
      # problem worth seeing next to the numbers.
      RUST_LOG: warn
    cmds:
      # --release is load-bearing and unique to this suite: the other three measure wasm
      # inside a browser, this one measures the host.
      - cargo test --release --package fantoccini-tests --test ssr_bench -- --ignored --nocapture

  ssr-bench-compare:
    desc: "SSR benchmark against an earlier run (BASELINE=path/to.json, defaults to the last)"
    env:
      RUST_LOG: warn
      VERTIGO_SSR_BENCH_BASELINE: '{{.BASELINE | default "target/bench/ssr/latest.json"}}'
    cmds:
      - cargo test --release --package fantoccini-tests --test ssr_bench -- --ignored --nocapture

  automated-tests:
    desc: "NOTE: WebDriver on localhost:9515 needs to be running"
    cmds:
      - cargo test --package fantoccini-tests --test basic --test demo -- --ignored

  demo-tests:
    desc: "Click through every demo tab in a browser (NOTE: WebDriver on localhost:9515 needs to be running)"
    cmds:
      - cargo test --package fantoccini-tests --test demo -- --ignored --nocapture

  ci:
    desc: Ci tests
    cmds:
      - cargo clippy --locked -p vertigo -p vertigo-macro --all-features --tests --target wasm32-unknown-unknown -- -Dwarnings
      - cargo clippy --locked -p vertigo-demo -p vertigo-example-counter -p vertigo-example-router -p vertigo-example-trafficlights --all-features --tests --target wasm32-unknown-unknown -- -Dwarnings
      - cargo test --locked --all-features
      # The shipping configuration of vertigo-cli. Everything above passes --all-features,
      # which turns `ssr-timings` on - so without this line the build that actually ships is
      # the one nothing lints.
      - cargo clippy --locked -p vertigo-cli --tests -- -Dwarnings
      - cargo fmt
      # - tests/check_versions.sh
      # - tests/js_tests.sh
      # - tests/check_vertigo_new.sh

  all-tests:
    desc: All tests
    deps: [unit-tests, automated-tests, demo-tests]

  clean:
    desc: Demo clean
    cmds:
      - cargo clean

  clean-build:
    desc: clean
    cmds:
      - rm -rf build build-reactive-bench build-dom-bench build-demo build-ssr-bench build-ssr-demo build-hydration-bench build-hydration-demo

  clippy-wasm32:
    desc: Run clippy for wasm32 target
    cmds:
      - cargo clippy --all-features --target wasm32-unknown-unknown -p vertigo -p vertigo-macro -p vertigo-demo -p vertigo-example-counter -p vertigo-example-router -p vertigo-example-trafficlights

  demo-debug-api:
    desc: Demo tasks - debug mode
    cmds:
      - cargo run --bin vertigo-demo-server

  demo-debug-watch:
    desc: Demo debug watch
    cmds:
      - cargo run --bin vertigo -- watch vertigo-demo --dest-dir=demo_build --wasm-run-source-map --env ws_chat=ws://127.0.0.1:3333/ws --env ws_collection=ws://127.0.0.1:3333/ws-collection

  demo-watch:
    desc: Demo watch
    deps: [demo-debug-api, demo-debug-watch]

  demo-serve-api:
    desc: Demo tasks - release mode
    cmds:
      - cargo run --bin vertigo-demo-server --release

  demo-serve:
    desc: Demo serve
    cmds:
      - cargo run --bin vertigo --release -- build vertigo-demo --dest-dir=demo_build --wasm-run-source-map
      - cargo run --bin vertigo --release -- serve --dest-dir=demo_build --env ws_chat=ws://127.0.0.1:3333/ws --env ws_collection=ws://127.0.0.1:3333/ws-collection

  demo:
    desc: Demo
    deps: [demo-serve-api, demo-serve]

  examples-counter:
    desc: Examples tasks
    cmds:
      - cargo run --bin vertigo -- watch vertigo-example-counter --dest-dir=examples/build/counter

  examples-router:
    desc: Examples router
    cmds:
      - cargo run --bin vertigo -- watch vertigo-example-router --dest-dir=examples/build/router

  examples-trafficlights:
    desc: Examples trafficlights
    cmds:
      - cargo run --bin vertigo -- watch vertigo-example-trafficlights --dest-dir=examples/build/trafficlights

  js-test:
    desc: JavaScript dev build
    cmds:
      - npm install
      - npm run test

  js-build:
    desc: Js build
    cmds:
      - npm install
      - npx rollup -c

  lint:
    desc: Lint
    cmds:
      - cargo run --bin lint-project

  git-branch-rebase-and-push:
    desc: Rebase current branch on master, squash to one commit, and force push
    cmds:
      - cargo fmt
      - task ci
      - |
          CURRENT_BRANCH=$(git branch --show-current)
          if [ "$CURRENT_BRANCH" = "master" ]; then
            echo "Error: You are on the 'master' branch. This task is for feature branches only."
            exit 1
          fi
          git fetch origin master
          git rebase origin/master

          # Find the first commit of this branch since origin/master
          FIRST_COMMIT=$(git rev-list --reverse origin/master..HEAD | head -n 1)
          if [ -z "$FIRST_COMMIT" ]; then
            echo "No commits to squash."
            exit 0
          fi

          # Squash everything into one commit using the first commit's identity
          git reset --soft origin/master
          git commit -C "$FIRST_COMMIT"

          git push origin "$CURRENT_BRANCH" --force
