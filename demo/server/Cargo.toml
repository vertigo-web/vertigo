[package]
name = "vertigo-demo-server"
version.workspace = true
edition.workspace = true

[dependencies]
# Without `http2`, like vertigo-cli (h2 0.3, RUSTSEC-2026-0258)
actix-web = { version = "4", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "cookies", "unicode", "compat", "ws"] }
actix-ws = "0.4"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2.0"

[lints]
workspace = true
