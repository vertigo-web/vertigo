[package]
name = "vertigo-macro"
description = "Reactive Real-DOM library with SSR for Rust - macros"
version.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[lib]
name = "vertigo_macro"
proc-macro = true

[dependencies]
base64 = "0.23"
crc = "3.4"
darling = "0.24"
heck = "0.5"
itertools = "0.15"
minreq = { version = "3.0", features = ["https-rustls"] }
pest = "2.9"
pest_derive = "2.9"
pkg-version = "1"
proc-macro-error = "1.0"
proc-macro2 = "1.0"
quote = "1.0"
rstml = "0.13"
syn = { version = "3.0", features = ["full"] }

[dev-dependencies]
prettyplease = "0.3"
pretty_assertions = "1.4"

[lints]
workspace = true
