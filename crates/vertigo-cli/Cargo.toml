[package]
name = "vertigo-cli"
description = "Reactive Real-DOM library with SSR for Rust - packaging/serving tool"
documentation = "https://docs.rs/vertigo-cli/"
categories = [
    "command-line-utilities",
    "development-tools::build-utils",
    "wasm",
    "web-programming",
    "web-programming::http-server",
]
version.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["vertigo", "wasm", "cli", "ssr", "server"]
homepage.workspace = true
license.workspace = true
edition.workspace = true

[[bin]]
name = "vertigo"
path = "src/main.rs"
doc = false

[lib]
name = "vertigo_cli"
path = "src/lib.rs"

[features]
default = []
# Per-request SSR phase timings, through `ServerState::request_timed`.
# Used by just ssr-bench.
ssr-timings = []

[dependencies]
actix-cors = "0.7"
actix-files = "0.7"
actix-http = "3"
# The default features without `http2`: since actix-web 4.19 a server with it answers HTTP/2
# cleartext (h2c) on `bind`, and actix's HTTP/2 runs on h2 0.3, which has no fix for
# RUSTSEC-2026-0258. An app serving HTTP/2 itself turns `http2` on in its own actix-web.
actix-web = { version = "4.16", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "cookies", "unicode", "compat", "ws"] }
awc = { version = "3.8", features = ["rustls-0_23-webpki-roots"] }
base64 = "0.23"
brotli = "9.0"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
crc = "3.4"
derive_more = "2.1"
env_logger = "0.11"
futures = "0.3"
html-escape = "0.3"
ignore = "0.4"
include_dir = "0.7"
log = "0.4"
notify = "8.2"
parking_lot = "0.13"
pkg-version = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
time = "0.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["full"] }
tokio-retry = "0.3"
url = "2.5"
walkdir = "2.5"
wasmtime = "50.0"
vertigo = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
actix-ws = "0.4"
