[package]
name = "fantoccini-tests"
version = "0.1.0"
authors = ["Michał Pokrywka <wolfmoon@o2.pl>"]
edition = "2024"
publish = false

[lib]
name = "fantoccini_tests"
path = "lib.rs"

[dev-dependencies]
fantoccini = "0.22"
# The table, the JSON file and the baseline comparison, shared by all four benchmark suites so
# that a run of one is readable and comparable the same way as a run of any other.
vertigo-bench-report = { path = "bench-report" }
# `ssr-timings` is what exposes `ServerState::request_timed`, which the SSR benchmark reads
# its per-phase breakdown from. Dev-dependency features do not reach the shipping binary.
vertigo-cli = { path = "../crates/vertigo-cli", features = ["ssr-timings"] }
vertigo-demo-server = { path = "../demo/server" }
# The SSR benchmark's subject app, as an rlib: the driver imports its route list and its
# size constants rather than keeping a second copy that can drift.
vertigo-test-ssr-bench = { path = "ssr-bench" }
vertigo-test-hydration-bench = { path = "hydration-bench" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }

[[test]]
name = "basic"
path = "basic/tests.rs"

[[test]]
name = "reactive_bench"
path = "reactive-bench/tests.rs"

[[test]]
name = "dom_bench"
path = "dom-bench/tests.rs"

[[test]]
name = "ssr_bench"
path = "ssr-bench/tests.rs"

[[test]]
name = "hydration_bench"
path = "hydration-bench/tests.rs"

[[test]]
name = "demo"
path = "demo/tests.rs"

[lints]
workspace = true
