[package]
name = "fantoccini-tests"
version = "0.1.0"
authors = ["Michał Pokrywka <wolfmoon@o2.pl>"]
edition = "2024"
publish = false

[dev-dependencies]
fantoccini = "0.22"
vertigo-cli = { path = "../crates/vertigo-cli" }
vertigo-demo-server = { path = "../demo/server" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }

[[test]]
name = "basic"
path = "basic/tests.rs"

[[test]]
name = "reactive_bench"
path = "reactive-bench/tests.rs"

[[test]]
name = "dom_bench"
path = "dom-bench/tests.rs"

[[test]]
name = "demo"
path = "demo/tests.rs"
