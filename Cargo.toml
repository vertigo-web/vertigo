[workspace]
members = [
    "crates/vertigo",
    "crates/vertigo-cli",
    "crates/vertigo-macro",
    "crates/vertigo-testing",

    "demo/app",
    "demo/server",

    "examples/counter",
    "examples/router",
    "examples/trafficlights",

    "tests",
    "tests/basic",
    "tests/bench-report",
    "tests/bench-support",
    "tests/dom-bench",
    "tests/hydration-bench",
    "tests/reactive-bench",
    "tests/ssr-bench",

    "lint-project",
]
exclude = ["build/vertigo-cli-test/some_app"]
resolver = "2"

[workspace.package]
version = "0.13.3"
edition = "2024"
repository = "https://github.com/vertigo-web/vertigo"
authors = [
    "Grzegorz Szeliga <szeligagrzegorz@gmail.com>",
    "Michał Pokrywka <wolfmoon@o2.pl>",
]
license = "MIT OR Apache-2.0"
keywords = ["wasm", "web", "frontend", "reactive", "ssr"]
homepage = "https://vertigo.znoj.pl"

[workspace.dependencies]
vertigo = { path = "./crates/vertigo", version = "0.13.3" }
vertigo-macro = { path = "./crates/vertigo-macro", version = "0.13.3" }
vertigo-cli = { path = "./crates/vertigo-cli", version = "0.13.3" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
incremental = true
